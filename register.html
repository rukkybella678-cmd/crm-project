<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CRM</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <div class="logo">
                CRM
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>

        </nav>
    </header>


    <!-- Registration Section -->
    <main class="auth-section">

        <div class="auth-container">

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Create your CRM account
            </p>


            <form id="registerForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Phone -->
                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="registerPassword"
                            name="password"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="toggleRegisterPassword"
                            class="password-toggle"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="password-toggle"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Terms -->
                <div class="remember-me">

                    <label>
                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        I agree to the terms and conditions
                    </label>

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>

            </form>


            <!-- Login Link -->
            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Customer Relationship Management System.
            All rights reserved.
        </p>

    </footer>


    <script src="js/auth.js"></script>

</body>

</html>
